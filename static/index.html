<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop-floor SOP Copilot</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#17202e;--mute:#566174;--line:#d5dbe3;--ok:#0b6b5d;--okbg:#e3f3ef;--warn:#8a4b00;--warnbg:#fff1d9;--btn:#17202e}
@media (prefers-color-scheme:dark){:root{--bg:#10151d;--card:#1a212c;--ink:#eef1f5;--mute:#9aa6b8;--line:#2d3746;--ok:#5fd3bd;--okbg:#14332d;--warn:#ffc46b;--warnbg:#3a2a0d;--btn:#eef1f5}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.3rem;margin:8px 0 2px}
.sub{color:var(--mute);margin:0 0 16px;font-size:.95rem}
textarea{width:100%;min-height:92px;padding:14px;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:10px;resize:vertical}
textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
#ask{width:100%;margin-top:10px;min-height:52px;font:600 1.05rem inherit;font-family:inherit;color:var(--bg);background:var(--btn);border:0;border-radius:10px}
#ask:disabled{opacity:.6}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chips button{font:.9rem inherit;font-family:inherit;padding:9px 12px;min-height:44px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;text-align:left}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
.card.found{border-left:6px solid var(--ok)}
.card.nf{border-left:6px solid var(--warn);background:var(--warnbg)}
.answer{white-space:pre-wrap;margin:0}
.warn{margin-top:12px;padding:10px 12px;background:var(--warnbg);color:var(--warn);border-radius:8px;font-size:.92rem}
.src{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:.92rem}
.src b{display:block}
.src .meta{color:var(--mute)}
.src a{display:inline-block;margin-top:6px;padding:8px 0;color:var(--ok);font-weight:600}
details{margin-top:6px}summary{color:var(--mute);cursor:pointer;min-height:32px}
pre{white-space:pre-wrap;font:.82rem/1.45 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);padding:10px;border-radius:8px;overflow-x:auto}
.tag{display:inline-block;font-size:.78rem;padding:1px 8px;border-radius:999px;background:var(--okbg);color:var(--ok);margin-left:6px}
</style>
</head>
<body>
<main>
  <h1>Ask the plant documents</h1>
  <p class="sub">Answers come only from your SOPs and manuals, with the source shown.</p>
  <textarea id="q" placeholder="e.g. What does alarm AL-104 mean?" aria-label="Your question"></textarea>
  <button id="ask">Get answer</button>
  <div class="chips" id="chips"></div>
  <div id="out" aria-live="polite"></div>
</main>
<script>
const EX=["What is the recommended coolant concentration for the TX-200?","Alarm AL-104: what does it mean and what do I do?","Who is allowed to remove a lockout lock?","Outer diameter tolerance for the BH-220 housing?","How often is spindle runout checked, and by whom?","How many samples for a lot of 200 pieces?"];
const q=document.getElementById('q'),out=document.getElementById('out'),btn=document.getElementById('ask');
EX.forEach(t=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{q.value=t;go()};chips.appendChild(b)});
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function go(){
  const text=q.value.trim(); if(!text)return;
  btn.disabled=true;btn.textContent='Searching…';
  try{
    const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:text})});
    const d=await r.json();
    const warn=(d.warnings||[]).map(w=>`<div class="warn">${esc(w)}</div>`).join('');
    const src=d.sources.map(s=>`<div class="src"><b>${esc(s.doc_id)} · Rev ${s.revision}<span class="tag">latest</span></b>
      <span class="meta">${esc(s.title)} · ${esc(s.section)} · page ${s.pages}</span><br>
      <a href="${s.link}" target="_blank" rel="noopener">Open the PDF at this page</a>
      <details><summary>Show the original text</summary><pre>${esc(s.snippet)}</pre></details></div>`).join('');
    out.innerHTML=`<div class="card ${d.found?'found':'nf'}"><p class="answer">${esc(d.answer)}</p>${warn}${src}</div>`;
  }catch(e){out.innerHTML='<div class="card nf"><p class="answer">Could not reach the server. Check you are on the same Wi-Fi.</p></div>'}
  btn.disabled=false;btn.textContent='Get answer';
}
btn.onclick=go;
q.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))go()});
</script>
</body>
</html>
